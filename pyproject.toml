[project]
name = "pullnexus"
version = "0.1.0"
description = "Pull from the Nexus. Give back to the Nexus. Keep local AI smart."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "typer[all]>=0.15",
    "rich>=14",
    "httpx>=0.28",
    "packaging>=24",
]

[project.scripts]
pullnexus = "pullnexus.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"