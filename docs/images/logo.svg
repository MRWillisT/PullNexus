<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 800" width="800" height="800">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#061526"/>
      <stop offset="100%" stop-color="#020810"/>
    </radialGradient>
    <radialGradient id="core-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#72e8ff" stop-opacity="0.32"/>
      <stop offset="55%" stop-color="#3599ff" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="dot-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#a0f4ff"/>
      <stop offset="100%" stop-color="#72e8ff"/>
    </radialGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="glow-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="text-glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="800" fill="url(#bg)" rx="60"/>

  <!-- Star field -->
  <g opacity="0.6">
    <circle cx="120" cy="80" r="1.2" fill="#6dcfff"/>
    <circle cx="680" cy="60" r="1.5" fill="#9ff4ff"/>
    <circle cx="50" cy="400" r="1" fill="#72e8ff"/>
    <circle cx="750" cy="350" r="1.3" fill="#72e8ff"/>
    <circle cx="200" cy="700" r="1.1" fill="#6dcfff"/>
    <circle cx="600" cy="720" r="1.4" fill="#9ff4ff"/>
    <circle cx="710" cy="180" r="0.9" fill="#72e8ff"/>
    <circle cx="90" cy="600" r="1.2" fill="#6dcfff"/>
    <circle cx="660" cy="620" r="0.8" fill="#9ff4ff"/>
    <circle cx="380" cy="40" r="1" fill="#72e8ff"/>
    <circle cx="30" cy="260" r="1.3" fill="#9ff4ff"/>
    <circle cx="770" cy="500" r="1.1" fill="#72e8ff"/>
  </g>

  <!-- Core glow -->
  <circle cx="400" cy="400" r="260" fill="url(#core-glow)"/>

  <!-- Outer ring -->
  <circle cx="400" cy="400" r="280" fill="none" stroke="#72e8ff" stroke-width="1.2" stroke-opacity="0.30"/>
  <!-- Mid ring -->
  <circle cx="400" cy="400" r="200" fill="none" stroke="#72e8ff" stroke-width="1.5" stroke-opacity="0.44" filter="url(#glow-soft)"/>
  <!-- Inner ring -->
  <circle cx="400" cy="400" r="128" fill="none" stroke="#9ff4ff" stroke-width="1.8" stroke-opacity="0.70" filter="url(#glow-soft)"/>

  <!-- Spoke lines to nodes (mid ring) -->
  <!-- Top: Skill Repository  ~10deg -->
  <line x1="400" y1="400" x2="404" y2="200" stroke="#72e8ff" stroke-width="0.8" stroke-opacity="0.25"/>
  <!-- Upper-right: Neural Network ~55deg -->
  <line x1="400" y1="400" x2="564" y2="235" stroke="#72e8ff" stroke-width="0.8" stroke-opacity="0.25"/>
  <!-- Lower-right: Training Data ~130deg -->
  <line x1="400" y1="400" x2="570" y2="555" stroke="#72e8ff" stroke-width="0.8" stroke-opacity="0.25"/>
  <!-- Lower-left: Data Cache ~215deg -->
  <line x1="400" y1="400" x2="238" y2="568" stroke="#72e8ff" stroke-width="0.8" stroke-opacity="0.25"/>
  <!-- Upper-left: Local Model ~295deg -->
  <line x1="400" y1="400" x2="228" y2="240" stroke="#72e8ff" stroke-width="0.8" stroke-opacity="0.25"/>

  <!-- Node dots on mid ring -->
  <!-- Top: Skill Repository (angle ~-80deg from right) -->
  <circle cx="404" cy="200" r="7" fill="url(#dot-glow)" filter="url(#glow)"/>
  <!-- Upper-right: Neural Network -->
  <circle cx="564" cy="235" r="7" fill="url(#dot-glow)" filter="url(#glow)"/>
  <!-- Lower-right: Training Data -->
  <circle cx="570" cy="555" r="7" fill="url(#dot-glow)" filter="url(#glow)"/>
  <!-- Lower-left: Data Cache -->
  <circle cx="238" cy="568" r="7" fill="url(#dot-glow)" filter="url(#glow)"/>
  <!-- Upper-left: Local Model -->
  <circle cx="228" cy="240" r="7" fill="url(#dot-glow)" filter="url(#glow)"/>

  <!-- Node labels -->
  <text x="404" y="182" text-anchor="middle" fill="#9ff4ff" font-size="14" font-family="'IBM Plex Mono', 'Courier New', monospace" letter-spacing="0.06em" opacity="0.85">Skill Repository</text>
  <text x="596" y="230" text-anchor="start" fill="#9ff4ff" font-size="14" font-family="'IBM Plex Mono', 'Courier New', monospace" letter-spacing="0.06em" opacity="0.85">Neural Network</text>
  <text x="596" y="562" text-anchor="start" fill="#9ff4ff" font-size="14" font-family="'IBM Plex Mono', 'Courier New', monospace" letter-spacing="0.06em" opacity="0.85">Training Data</text>
  <text x="226" y="595" text-anchor="end" fill="#9ff4ff" font-size="14" font-family="'IBM Plex Mono', 'Courier New', monospace" letter-spacing="0.06em" opacity="0.85">Data Cache</text>
  <text x="214" y="230" text-anchor="end" fill="#9ff4ff" font-size="14" font-family="'IBM Plex Mono', 'Courier New', monospace" letter-spacing="0.06em" opacity="0.85">Local Model</text>

  <!-- Central hub circle -->
  <circle cx="400" cy="400" r="100" fill="#051322" stroke="#9ff4ff" stroke-width="1.5" stroke-opacity="0.6" filter="url(#glow-soft)"/>
  <circle cx="400" cy="400" r="90" fill="none" stroke="#72e8ff" stroke-width="0.8" stroke-opacity="0.35"/>

  <!-- Central text -->
  <text x="400" y="393" text-anchor="middle" fill="#eaf7ff" font-size="26" font-weight="700" font-family="'Oxanium', 'Arial', sans-serif" letter-spacing="-0.02em" filter="url(#text-glow)">PullNexus</text>
  <text x="400" y="415" text-anchor="middle" fill="#72e8ff" font-size="11" font-family="'IBM Plex Mono', 'Courier New', monospace" letter-spacing="0.14em" opacity="0.75">PACKAGE REGISTRY</text>

  <!-- Tagline at bottom -->
  <text x="400" y="760" text-anchor="middle" fill="#72e8ff" font-size="14" font-family="'IBM Plex Mono', 'Courier New', monospace" letter-spacing="0.06em" opacity="0.55">Pull from the Nexus. Give back to the Nexus. Keep local AI smart.</text>
</svg>
