name: Validate Submission

on:
  pull_request:
    branches: [main]
    paths:
      - "skills/**"
      - "prompts/**"
      - "tools/**"
      - "datasets/**"
      - "playbooks/**"
      - "policies/**"
      - "evals/**"
      - "templates/**"
      - "environments/**"
      - "repositories/**"

jobs:
  validate:
    name: Validate resource submission
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Get changed files
        run: |
          git diff --name-only origin/${{ github.base_ref }}...HEAD > changed_files.txt
          echo "Changed files:"
          cat changed_files.txt

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Run submission validator
        run: python scripts/validate_submission.py --changed-files changed_files.txt
